name: Setup Shatr Chess960 Project

on:
  workflow_dispatch:

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Project Files
        run: |
          mkdir -p lib/theme lib/engine lib/widgets lib/screens

          cat << 'EOF' > pubspec.yaml
          name: shatr
          description: SHATR - Fischer Random Chess 960 with VisionOS Liquid Glassmorphism
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.3.0 <4.0.0'
            flutter: '>=3.19.0'

          dependencies:
            flutter:
              sdk: flutter
            dartchess: ^0.9.0
            cupertino_icons: ^1.0.6

          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > analysis_options.yaml
          include: package:flutter_lints/flutter.yaml

          linter:
            rules:
              prefer_const_constructors: true
              avoid_print: true
          EOF

          cat << 'EOF' > README.md
          # SHATR - Chess 960

          تطبيق شطرنج فيشر (960) بواجهة VisionOS Liquid Glassmorphism.

          ## التشغيل
          ```bash
          flutter pub get
          flutter run
          ```
          EOF

          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

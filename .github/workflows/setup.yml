          }
          EOF

          cat << 'EOF' > lib/theme/shatr_colors.dart
          import 'package:flutter/material.dart';

          class ShatrColors {
            static const background    = Color(0xFF0A0A0F);
            static const surfaceDeep   = Color(0xFF14141A);
            static const accentRed     = Color(0xFFE63946);
            static const accentRedGlow = Color(0x40E63946);
            static const textPrimary   = Color(0xFFF5F5F7);
            static const textSecondary = Color(0xFF9A9AA5);

            static const boardLight       = Color(0xFF2A2A35);
            static const boardDark        = Color(0xFF1A1A22);
            static const highlightMove    = Color(0x8034C759);
            static const highlightCapture = Color(0x80E63946);
            static const highlightSelect  = Color(0x40E63946);
          }
          EOF

          cat << 'EOF' > lib/engine/chess960_generator.dart
          class Chess960Generator {
            static const _lightBishop = [1, 3, 5, 7];
            static const _darkBishop  = [0, 2, 4, 6];
            static const _knightPairs = [
              [0, 1], [0, 2], [0, 3], [0, 4],
              [1, 2], [1, 3], [1, 4],
              [2, 3], [2, 4],
              [3, 4],
            ];

            static List<String> generate(int id) {
              assert(id >= 0 && id < 960, 'Position ID must be in [0, 959]');
              final rank = List<String?>.filled(8, null);
              int n = id;

              rank[_lightBishop[n % 4]] = 'B';
              n ~/= 4;

              rank[_darkBishop[n % 4]] = 'B';
              n ~/= 4;

              rank[_nthEmpty(rank, (n % 6) + 1)] = 'Q';
              n ~/= 6;

              final empty = _emptyIndices(rank);
              final kp = _knightPairs[n];
              rank[empty[kp[0]]] = 'N';
              rank[empty[kp[1]]] = 'N';

              final rem = _emptyIndices(rank);
              rank[rem[0]] = 'R';
              rank[rem[1]] = 'K';
              rank[rem[2]] = 'R';

              return rank.cast<String>();
            }

            static String toFen(int id) {
              final rank = generate(id);
              final back = rank.join();

              final qIdx = rank.indexOf('R');
              final kIdx = rank.lastIndexOf('R');
              final qFile = String.fromCharCode(97 + qIdx);
              final kFile = String.fromCharCode(97 + kIdx);

              final white = '${qFile.toUpperCase()}${kFile.toUpperCase()}';
              final black = '${qFile.toLowerCase()}${kFile.toLowerCase()}';

              return '$back/pppppppp/8/8/8/8/PPPPPPPP/$back w $white$black - 0 1';
            }

            static List<int> _emptyIndices(List<String?> rank) {
              final out = <int>[];
              for (var i = 0; i < rank.length; i++) {
                if (rank[i] == null) out.add(i);
              }
              return out;
            }

            static int _nthEmpty(List<String?> rank, int n) {
              var count = 0;
              for (var i = 0; i < rank.length; i++) {
                if (rank[i] == null) {
                  count++;
                  if (count == n) return i;
                }
              }
              throw StateError('No empty square');
            }
          }
          EOF

          cat << 'EOF' > lib/widgets/glass_card.dart
          import 'dart:ui';
          import 'package:flutter/material.dart';

          class GlassCard extends StatelessWidget {
            final Widget child;
            final double blur;
            final double opacity;
            final BorderRadius borderRadius;

            const GlassCard({
              super.key,
              required this.child,
              this.blur = 20,
              this.opacity = 0.08,
              this.borderRadius = const BorderRadius.all(Radius.circular(24)),
            });

            @override
            Widget build(BuildContext context) {
              return ClipRRect(
                borderRadius: borderRadius,
                child: BackdropFilter(
                  filter: ImageFilter.blur(sigmaX: blur, sigmaY: blur),
                  child: Container(
                    decoration: BoxDecoration(
                      color: Colors.white.withValues(alpha: opacity),
                      borderRadius: borderRadius,
                      border: Border.all(color: Colors.white.withValues(alpha: 0.15)),
                      gradient: LinearGradient(
                        begin: Alignment.topLeft,
                        end: Alignment.bottomRight,
                        colors: [
                          Colors.white.withValues(alpha: 0.12),
                          Colors.white.withValues(alpha: 0.04),
                        ],
                      ),
                    ),
                    child: child,
                  ),
                ),
              );
            }
          }
          EOF

          cat << 'EOF' > lib/screens/home_screen.dart
